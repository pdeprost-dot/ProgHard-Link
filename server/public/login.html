<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign in — ProgHard Link</title>
  <link rel="stylesheet" href="/login.css">
</head>
<body>
  <main>
    <form id="login-form">
      <strong>ProgHard Link</strong>
      <h1>Sign in</h1>
      <label>Username<input id="username" name="username" autocomplete="username" required maxlength="32"></label>
      <label>Password<input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256"></label>
      <p id="error" role="alert"></p>
      <button type="submit">Sign in</button>
    </form>
  </main>
  <script src="/login.js"></script>
</body>
</html>
